<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Life in Weeks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%3Crect%20x%3D%226%22%20y%3D%224%22%20width%3D%2254%22%20height%3D%2256%22%20rx%3D%227%22%20fill%3D%22%23E3E7E1%22%20stroke%3D%22%231A1A1A%22%20stroke-width%3D%223%22/%3E%0A%3Ccircle%20cx%3D%226%22%20cy%3D%2216%22%20r%3D%223%22%20fill%3D%22%231A1A1A%22/%3E%0A%3Ccircle%20cx%3D%226%22%20cy%3D%2228%22%20r%3D%223%22%20fill%3D%22%231A1A1A%22/%3E%0A%3Ccircle%20cx%3D%226%22%20cy%3D%2240%22%20r%3D%223%22%20fill%3D%22%231A1A1A%22/%3E%0A%3Ccircle%20cx%3D%226%22%20cy%3D%2252%22%20r%3D%223%22%20fill%3D%22%231A1A1A%22/%3E%0A%3Cline%20x1%3D%2220%22%20y1%3D%2220%22%20x2%3D%2252%22%20y2%3D%2220%22%20stroke%3D%22%23B8862E%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%0A%3Cline%20x1%3D%2220%22%20y1%3D%2232%22%20x2%3D%2252%22%20y2%3D%2232%22%20stroke%3D%22%23B8862E%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%0A%3Cline%20x1%3D%2220%22%20y1%3D%2244%22%20x2%3D%2240%22%20y2%3D%2244%22%20stroke%3D%22%23B8862E%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%0A%3C/svg%3E">
<meta name="description" content="A ledger of your life, one stamp per week — with room to write a note in every one, and search to find them again.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E3E7E1;
    --paper-line: #A9C7DA;
    --ink: #26332D;
    --ink-soft: #5b6b62;
    --lived-black: #1A1A1A;
    --brass: #B8862E;
    --brass-soft: #d9c197;
    --coral: #C1543D;
    --teal: #1F8A8A;
    --match-yellow: #F5C518;
    --note-green: #2E7D46;
    --card: #EEF1EB;
    --shadow-sm: 0 1px 2px rgba(38,51,45,0.06), 0 1px 1px rgba(38,51,45,0.04);
    --shadow-md: 0 4px 14px rgba(38,51,45,0.10), 0 1px 3px rgba(38,51,45,0.08);
    --shadow-lg: 0 20px 50px rgba(20,26,22,0.28), 0 4px 14px rgba(20,26,22,0.14);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
  }

  body{
    background:
      radial-gradient(ellipse 900px 700px at 50% 0%, rgba(184,134,46,0.10), transparent 60%),
      radial-gradient(ellipse 1200px 900px at 50% 100%, rgba(20,20,20,0.05), transparent 65%),
      var(--paper);
    min-height: 100vh;
  }

  .wrap{
    max-width: 1220px;
    margin: 0 auto;
    padding: 56px 24px 56px;
    position: relative;
  }

  header.hero{
    margin-bottom: 32px;
    position: relative;
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lived-black);
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(48px, 9vw, 78px);
    line-height: 1;
    margin: 0 0 14px;
    padding-bottom: 18px;
    letter-spacing: 0.01em;
    border-bottom: 2px solid var(--ink);
  }

  h1 em{ font-style: italic; font-weight: 500; color: var(--brass); }

  .thesis{
    max-width: 60ch;
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 32px;
  }

  .controls{
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    align-items: flex-end;
    padding: 0;
  }

  .field{ display: flex; flex-direction: column; gap: 6px; }

  .field label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .field input[type="number"]{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    padding: 9px 11px;
    border: 1px solid #9CBFD6;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    width: 90px;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .field input[type="number"]:focus{
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(31,138,138,0.16);
  }

  .field small{ color: var(--ink-soft); font-size: 11px; }

  .date-input-single{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    padding: 9px 11px;
    border: 1px solid #9CBFD6;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    width: 170px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .date-input-single:focus{
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(31,138,138,0.16);
  }

  .calendar-popup{
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    padding: 14px;
    z-index: 30;
    width: 260px;
  }

  .calendar-popup.open{ display: block; }

  .cal-header{
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }

  .cal-header select{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 5px 6px;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }

  .cal-header select#calMonthSel{ flex: 1; }
  .cal-header select#calYearSel{ width: 74px; }

  .cal-header button{
    font-family: 'IBM Plex Mono', monospace;
    padding: 5px 9px;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .cal-header button:hover{ background: var(--paper); }

  .cal-weekdays{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 4px;
  }

  .cal-days{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-day{
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink);
  }

  .cal-day:hover{ background: var(--paper); }
  .cal-day.empty{ cursor: default; }
  .cal-day.empty:hover{ background: transparent; }
  .cal-day.selected{ background: var(--note-green); color: #fff; }

  .stats{ display: flex; gap: 28px; margin-left: auto; flex-wrap: wrap; }
  .stat{ text-align: right; }
  .stat .n{ font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: var(--ink); display:block; }
  .stat .l{ font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }

  /* --- Search bar --- */

  .searchbar{
    margin-top: 28px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--paper-line);
    border-radius: 0;
    padding: 0 0 12px 0;
  }

  .searchbar::before{
    content: '⌕';
    font-size: 16px;
    color: var(--teal);
    font-weight: 600;
  }

  .searchbar input[type="text"]{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 4px;
    border: none;
    background: transparent;
    color: var(--ink);
    flex: 1;
    min-width: 220px;
  }

  .searchbar input[type="text"]:focus{ outline: none; }

  .search-count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #fff;
    background: var(--teal);
    padding: 5px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .search-count:empty{ display: none; padding: 0; }

  /* --- The ledger grid --- */

  .ledger{
    margin-top: 40px;
    position: relative;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .ledger-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .ledger-head h2{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 21px;
    margin: 0;
    color: var(--ink);
  }

  .legend{
    display: flex;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    align-items: center;
    flex-wrap: wrap;
  }

  .legend span:not(.swatch){
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 20px;
    padding: 4px 10px 4px 6px;
    display: inline-flex;
    align-items: center;
  }

  .legend .swatch{
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .sw-lived{ background: var(--lived-black); }
  .sw-now{ background: var(--coral); }
  .sw-future{ border: 1px solid #8FB6CF; background: transparent; }
  .sw-note{ background: var(--note-green); position: relative; }
  .sw-match{ background: var(--match-yellow); }

  .year-row{
    display: grid;
    grid-template-columns: 40px 1fr;
    align-items: center;
    gap: 12px;
  }

  .year-row.decade-mark{
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1.5px solid var(--paper-line);
  }

  .week-number-row{
    display: grid;
    grid-template-columns: 40px 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .week-number-grid{
    display: grid;
    grid-template-columns: repeat(52, minmax(13px, 1fr));
    gap: 5px;
  }

  .week-number-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--ink-soft);
    text-align: center;
    padding-bottom: 6px;
  }

  .year-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--lived-black);
    text-align: right;
    letter-spacing: 0.02em;
  }

  .year-grid{
    display: grid;
    grid-template-columns: repeat(52, minmax(13px, 1fr));
    gap: 5px;
    padding: 4px 0;
  }

  .cell{
    width: 100%;
    position: relative;
    cursor: pointer;
  }

  .cell::before{
    content: '';
    display: block;
    width: 100%;
    height: 0;
    padding-top: 100%;
    box-sizing: border-box;
    border-radius: 50%;
    transition: transform 0.15s ease, opacity 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  .cell:hover::before{ transform: scale(1.5); }
  .cell:hover{ z-index: 3; }

  .cell.lived::before{ background: var(--lived-black); }
  .cell.future::before{ box-shadow: inset 0 0 0 1.5px #6E97AD; background: transparent; }

  .cell.void::before{
    background: transparent;
    border: none;
  }
  .cell.void{
    cursor: default;
    pointer-events: none;
  }

  .cell.now::before{
    background: var(--coral);
    box-shadow: 0 0 0 3px rgba(193,84,61,0.22);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100% { box-shadow: 0 0 0 3px rgba(193,84,61,0.22); }
    50% { box-shadow: 0 0 0 6px rgba(193,84,61,0.10); }
  }

  .cell.has-note::before{
    background: var(--note-green) !important;
    border-color: var(--note-green) !important;
  }

  /* search states */
  .cell.dim::before{ opacity: 0.15; }

  .cell.match::before{
    background: var(--match-yellow) !important;
    border-color: var(--match-yellow) !important;
    opacity: 1;
  }
  .cell.match{ z-index: 4; }

  .cell:hover .tip{
    display: block;
  }

  .tip{
    display: none;
    position: absolute;
    bottom: 135%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #EEF1EB;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    line-height: 1.4;
    white-space: nowrap;
    max-width: 220px;
    white-space: normal;
    padding: 6px 8px;
    border-radius: 3px;
    z-index: 6;
    pointer-events: none;
  }

  .tip .tip-note{
    display: block;
    color: var(--brass-soft);
    margin-top: 3px;
    font-style: italic;
  }

  footer{
    margin-top: 56px;
    padding-top: 24px;
    border-top: 2px solid var(--ink);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }

  button:hover{ background: var(--ink); color: var(--paper); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  button:active{ transform: translateY(0); }

  button.primary{ background: var(--brass); border-color: var(--brass); color: #fff; }
  button.primary:hover{ background: #a1741f; border-color: #a1741f; }

  .credit{
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* --- Note modal --- */

  .overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 17, 0.6);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    z-index: 20;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.open{ display: flex; animation: fadeIn 0.15s ease; }

  @keyframes fadeIn{ from{ opacity: 0; } to{ opacity: 1; } }
  @keyframes popIn{ from{ opacity: 0; transform: translateY(6px) scale(0.98); } to{ opacity: 1; transform: translateY(0) scale(1); } }

  .modal{
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    width: 100%;
    max-width: 460px;
    padding: 26px;
    box-shadow: var(--shadow-lg);
    animation: popIn 0.18s ease;
  }

  .modal .eyebrow{ margin-bottom: 4px; }

  .modal h3{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 4px;
  }

  .modal .sub{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .modal textarea{
    width: 100%;
    min-height: 140px;
    font-family: 'Lora', serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 12px 14px;
    border: 1px solid #9CBFD6;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    resize: vertical;
  }

  .modal textarea:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }

  .day-tabs{
    display: flex;
    gap: 3px;
    margin-bottom: 12px;
  }

  .day-tab{
    flex: 1 1 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 7px 2px;
    border-radius: 6px 6px 0 0;
    border: 1px solid #9CBFD6;
    border-bottom: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    position: relative;
    text-align: center;
    white-space: nowrap;
    transition: all 0.12s ease;
  }

  .day-tab:hover{ color: var(--teal); }

  .day-tab.active{
    background: #fff;
    color: var(--ink);
    font-weight: 600;
  }

  .day-tab .day-dot{
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--note-green);
    margin-left: 5px;
    vertical-align: middle;
  }

  .dictate-row{
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .dictate-lang-select{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 8px;
    border-radius: 6px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
  }

  .dictate-btn{
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 6px;
    border: 1px solid var(--paper-line);
    background: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 7px 12px;
    transition: all 0.15s ease;
  }

  .dictate-btn:hover{ border-color: var(--teal); color: var(--teal); }

  .dictate-btn.active{
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
    animation: dictatePulse 1.3s ease-in-out infinite;
  }

  @keyframes dictatePulse{
    0%, 100% { box-shadow: 0 0 0 0 rgba(193,84,61,0.45); }
    50% { box-shadow: 0 0 0 6px rgba(193,84,61,0); }
  }

  .media-thumbs{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .media-thumb{
    position: relative;
    width: 74px;
    height: 74px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--paper-line);
    background: #000;
  }

  .media-thumb img,
  .media-thumb video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
  }

  .media-thumb .media-remove{
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    line-height: 18px;
    text-align: center;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: rgba(20,20,20,0.75);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }

  .media-thumb .video-badge{
    position: absolute;
    bottom: 2px;
    left: 2px;
    background: rgba(20,20,20,0.75);
    color: #fff;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    pointer-events: none;
  }

  .lightbox{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 10, 0.88);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .lightbox.open{ display: flex; }

  .lightbox-content{
    max-width: 100%;
    max-height: 100%;
    display: flex;
  }

  .lightbox-img,
  .lightbox-video{
    max-width: 100%;
    max-height: 90vh;
    border-radius: 6px;
    display: block;
  }

  .lightbox-close{
    position: absolute;
    top: 20px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox-close:hover{ background: rgba(255,255,255,0.22); }

  .lightbox-nav{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox-nav:hover{ background: rgba(255,255,255,0.22); }
  .lightbox-nav.hidden{ display: none; }

  .lightbox-prev{ left: 20px; }
  .lightbox-next{ right: 20px; }

  .media-buttons{
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .media-add-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px dashed #A9C7DA;
    color: var(--ink-soft);
    cursor: pointer;
    background: transparent;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .media-add-btn:hover{ border-color: var(--teal); color: var(--teal); }

  .media-add-btn.recording{
    background: var(--coral);
    border: 1px solid var(--coral);
    border-style: solid;
    color: #fff;
    animation: dictatePulse 1.3s ease-in-out infinite;
  }

  .media-thumb.audio-thumb{
    width: auto;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px 0 10px;
    background: var(--card);
    cursor: pointer;
  }

  .media-thumb.audio-thumb .audio-icon{ font-size: 16px; }
  .media-thumb.audio-thumb .audio-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .lightbox-audio{ width: 320px; max-width: 80vw; }

  .modal-actions{
    margin-top: 16px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  button.danger{ border-color: var(--coral); color: var(--coral); }
  button.danger:hover{ background: var(--coral); color: #fff; }

  @media (max-width: 640px){
    .year-row, .week-number-row{ grid-template-columns: 26px 1fr; }
    .year-grid, .week-number-grid{ gap: 3px; }
    .stats{ margin-left: 0; }
  }

  @media print{
    body{ background: #fff; background-image: none; }
    .controls, footer, .searchbar{ display: none; }
    .wrap{ padding: 0; max-width: 100%; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <h1>My life in weeks</h1>

    <div class="controls">
      <div class="field" style="position:relative;">
        <label for="birthDateText">Born on</label>
        <input type="text" id="birthDateText" readonly placeholder="Select date" class="date-input-single">

        <div class="calendar-popup" id="calendarPopup">
          <div class="cal-header">
            <button type="button" id="calPrevMonth">‹</button>
            <select id="calMonthSel"></select>
            <select id="calYearSel"></select>
            <button type="button" id="calNextMonth">›</button>
          </div>
          <div class="cal-weekdays">
            <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
          </div>
          <div class="cal-days" id="calDays"></div>
        </div>
      </div>
      <div class="field">
        <label for="expectancy">Expected years</label>
        <input type="number" id="expectancy" min="1" max="110" value="80">
      </div>

      <div class="stats" id="stats" style="display:none;">
        <div class="stat"><span class="n" id="statLived">0</span><span class="l">weeks lived</span></div>
        <div class="stat"><span class="n" id="statLeft">0</span><span class="l">weeks left</span></div>
        <div class="stat"><span class="n" id="statNotes">0</span><span class="l">weeks noted</span></div>
      </div>
    </div>

    <div class="searchbar">
      <input type="text" id="searchBox" placeholder="Search your notes — try a name, a place, a feeling…">
      <span class="search-count" id="searchCount"></span>
    </div>
  </header>

  <section class="ledger" id="ledgerSection" style="display:none;">
    <div class="ledger-head">
      <div class="legend">
        <span><span class="swatch sw-lived"></span>Lived</span>
        <span><span class="swatch sw-now"></span>This week</span>
        <span><span class="swatch sw-future"></span>Ahead</span>
        <span><span class="swatch sw-note"></span>Has a note</span>
        <span><span class="swatch sw-match"></span>Search match</span>
      </div>
    </div>
    <div id="grid"></div>
  </section>

  <footer>
    <button id="notesPdfBtn">Download notes as PDF</button>
    <button id="notesTxtBtn">Download notes as TXT</button>
    <button class="danger" id="deleteAllBtn">Delete All Notes</button>
  </footer>

</div>

<div class="lightbox" id="mediaLightbox">
  <button type="button" id="lightboxClose" class="lightbox-close">×</button>
  <button type="button" id="lightboxPrev" class="lightbox-nav lightbox-prev">‹</button>
  <div id="lightboxContent" class="lightbox-content"></div>
  <button type="button" id="lightboxNext" class="lightbox-nav lightbox-next">›</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <p class="eyebrow">Week entry</p>
    <h3 id="modalTitle">—</h3>
    <p class="sub" id="modalSub"></p>

    <div class="day-tabs" id="dayTabs"></div>

    <div class="dictate-row">
      <select id="dictateLang" class="dictate-lang-select"></select>
      <button type="button" id="dictateBtn" class="dictate-btn" title="Dictate with microphone">🎤 Dictate</button>
    </div>
    <textarea id="modalTextarea" placeholder="What happened this day? Who were you with? What were you thinking about?"></textarea>

    <div class="media-thumbs" id="mediaThumbs"></div>

    <div class="media-buttons">
      <label class="media-add-btn" for="photoInput">+ Add photo</label>
      <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
      <label class="media-add-btn" for="videoInput">+ Add video</label>
      <input type="file" id="videoInput" accept="video/*" multiple style="display:none;">
      <button type="button" id="recordAudioBtn" class="media-add-btn">🎙 Record voice note</button>
    </div>

    <div class="modal-actions">
      <button class="danger" id="modalDelete">Delete note</button>
      <button id="modalCancel">Cancel</button>
      <button id="modalSave">Save note</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const birthDateText = document.getElementById('birthDateText');
  const calendarPopup = document.getElementById('calendarPopup');
  const calMonthSel = document.getElementById('calMonthSel');
  const calYearSel = document.getElementById('calYearSel');
  const calDays = document.getElementById('calDays');
  const calPrevMonth = document.getElementById('calPrevMonth');
  const calNextMonth = document.getElementById('calNextMonth');
  const expectancyInput = document.getElementById('expectancy');
  const searchBox = document.getElementById('searchBox');
  const searchCount = document.getElementById('searchCount');
  const grid = document.getElementById('grid');
  const ledgerSection = document.getElementById('ledgerSection');
  const statsEl = document.getElementById('stats');

  const ENGLISH_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let selectedBirthDate = null; // {y, m (0-11), d}
  let viewYear, viewMonth; // currently displayed month in the popup

  function populateCalControls(){
    calMonthSel.innerHTML = ENGLISH_MONTHS.map((m, i) => `<option value="${i}">${m}</option>`).join('');
    const nowY = new Date().getFullYear();
    let yearOpts = '';
    for(let y = nowY; y >= nowY - 120; y--){ yearOpts += `<option value="${y}">${y}</option>`; }
    calYearSel.innerHTML = yearOpts;
  }
  populateCalControls();

  function renderCalendarDays(){
    calMonthSel.value = viewMonth;
    calYearSel.value = viewYear;

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    let startOffset = firstOfMonth.getDay() - 1; // Monday-first grid
    if(startOffset < 0) startOffset = 6;
    const daysCount = new Date(viewYear, viewMonth + 1, 0).getDate();

    let html = '';
    for(let i = 0; i < startOffset; i++){ html += '<div class="cal-day empty"></div>'; }
    for(let d = 1; d <= daysCount; d++){
      const isSelected = selectedBirthDate && selectedBirthDate.y === viewYear && selectedBirthDate.m === viewMonth && selectedBirthDate.d === d;
      html += `<div class="cal-day${isSelected ? ' selected' : ''}" data-day="${d}">${d}</div>`;
    }
    calDays.innerHTML = html;

    calDays.querySelectorAll('.cal-day:not(.empty)').forEach(el => {
      el.addEventListener('click', () => {
        selectedBirthDate = { y: viewYear, m: viewMonth, d: Number(el.dataset.day) };
        updateBirthDateDisplay();
        calendarPopup.classList.remove('open');
        render(true);
      });
    });
  }

  function updateBirthDateDisplay(){
    if(!selectedBirthDate) return;
    const { y, m, d } = selectedBirthDate;
    birthDateText.value = `${d} ${ENGLISH_MONTHS[m]} ${y}`;
  }

  function getBirthDateValue(){
    if(!selectedBirthDate) return '';
    const { y, m, d } = selectedBirthDate;
    return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function setBirthDateValue(dateStr){
    const [y, m, d] = dateStr.split('-').map(Number);
    selectedBirthDate = { y, m: m - 1, d };
    viewYear = y;
    viewMonth = m - 1;
    updateBirthDateDisplay();
    renderCalendarDays();
  }

  birthDateText.addEventListener('click', () => {
    if(!selectedBirthDate){
      const now = new Date();
      viewYear = now.getFullYear() - 30;
      viewMonth = now.getMonth();
    }
    renderCalendarDays();
    calendarPopup.classList.toggle('open');
  });

  calMonthSel.addEventListener('change', () => { viewMonth = Number(calMonthSel.value); renderCalendarDays(); });
  calYearSel.addEventListener('change', () => { viewYear = Number(calYearSel.value); renderCalendarDays(); });

  calPrevMonth.addEventListener('click', () => {
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendarDays();
  });
  calNextMonth.addEventListener('click', () => {
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendarDays();
  });

  document.addEventListener('click', (e) => {
    if(!calendarPopup.contains(e.target) && e.target !== birthDateText){
      calendarPopup.classList.remove('open');
    }
  });

  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalSub = document.getElementById('modalSub');
  const modalTextarea = document.getElementById('modalTextarea');
  const modalSave = document.getElementById('modalSave');
  const modalDelete = document.getElementById('modalDelete');
  const modalCancel = document.getElementById('modalCancel');

  const MS_WEEK = 7 * 24 * 60 * 60 * 1000;
  const LS_NOTES = 'liw_notes';
  const LS_BIRTH = 'liw_birthdate';
  const LS_EXPECT = 'liw_expectancy';

  const DAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  let notes = {};
  try { notes = JSON.parse(localStorage.getItem(LS_NOTES) || '{}'); } catch(e) { notes = {}; }

  // Normalize older entry shapes into a 7-slot per-day array (Mon..Sun).
  Object.keys(notes).forEach(k => {
    const v = notes[k];
    if(typeof v === 'string'){
      notes[k] = [v, '', '', '', '', '', ''];
    } else if(Array.isArray(v)){
      while(v.length < 7) v.push('');
    } else if(v && typeof v === 'object'){
      const t = v.text || '';
      notes[k] = [t, '', '', '', '', '', ''];
    } else {
      delete notes[k];
    }
    if(Array.isArray(notes[k]) && !notes[k].some(t => t && t.trim())){
      // entry with no text on any day at all — leave as-is; media/state elsewhere decides deletion
    }
  });

  function entryHasText(key){
    const v = notes[key];
    return Array.isArray(v) && v.some(t => t && t.trim());
  }

  function entryFullText(key){
    const v = notes[key];
    return Array.isArray(v) ? v.join(' ') : '';
  }

  let activeKey = null; // date key currently open in the modal

  function saveNotes(){
    localStorage.setItem(LS_NOTES, JSON.stringify(notes));
  }

  function formatDate(d){
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function formatRange(start, end){
    const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
    if(sameMonth){
      return `${start.getDate()}-${end.getDate()} ${MONTHS_EN[start.getMonth()]} ${start.getFullYear()}`;
    }
    const sameYear = start.getFullYear() === end.getFullYear();
    if(sameYear){
      return `${start.getDate()} ${MONTHS_EN[start.getMonth()]} – ${end.getDate()} ${MONTHS_EN[end.getMonth()]} ${end.getFullYear()}`;
    }
    return `${start.getDate()} ${MONTHS_EN[start.getMonth()]} ${start.getFullYear()} – ${end.getDate()} ${MONTHS_EN[end.getMonth()]} ${end.getFullYear()}`;
  }

  function addDays(date, days){
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function dateKey(d){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // --- Media storage (photos & video) — kept in IndexedDB since it holds
  // much more than localStorage's few MB.
  const MEDIA_DB_NAME = 'lifeInWeeksMedia';
  const MEDIA_STORE = 'media';
  let mediaDbPromise = null;

  function openMediaDB(){
    if(mediaDbPromise) return mediaDbPromise;
    mediaDbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(MEDIA_DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains(MEDIA_STORE)){
          db.createObjectStore(MEDIA_STORE, { keyPath: 'key' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return mediaDbPromise;
  }

  async function getMedia(key){
    const db = await openMediaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(MEDIA_STORE, 'readonly');
      const req = tx.objectStore(MEDIA_STORE).get(key);
      req.onsuccess = () => resolve(req.result || { key, images: [], videos: [], audios: [] });
      req.onerror = () => reject(req.error);
    });
  }

  async function saveMedia(key, images, videos, audios){
    const db = await openMediaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(MEDIA_STORE, 'readwrite');
      const store = tx.objectStore(MEDIA_STORE);
      if(images.length === 0 && videos.length === 0 && audios.length === 0){
        store.delete(key);
      } else {
        store.put({ key, images, videos, audios });
      }
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function clearAllMedia(){
    const db = await openMediaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(MEDIA_STORE, 'readwrite');
      tx.objectStore(MEDIA_STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function getAllMediaKeys(){
    const db = await openMediaDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(MEDIA_STORE, 'readonly');
      const req = tx.objectStore(MEDIA_STORE).getAllKeys();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  let mediaKeysCache = new Set();
  async function refreshMediaKeysCache(){
    try{ mediaKeysCache = new Set(await getAllMediaKeys()); }
    catch(e){ mediaKeysCache = new Set(); }
  }

  function resizeImageFile(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1000;
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve({ src: canvas.toDataURL('image/jpeg', 0.78), w: width, h: height });
        };
        img.onerror = () => reject(new Error('Could not read image.'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('Could not read file.'));
      reader.readAsDataURL(file);
    });
  }

  const MAX_VIDEO_MB = 60;

  // In-memory media for whichever week is currently open in the modal.
  let currentImages = [];
  let currentVideos = [];
  let currentAudios = [];

  let lightboxMediaList = [];
  let lightboxIndex = 0;

  function renderLightboxItem(index){
    const inner = document.getElementById('lightboxContent');
    inner.querySelectorAll('video, audio').forEach(v => v.pause());
    inner.innerHTML = '';

    const item = lightboxMediaList[index];
    if(!item) return;

    let el;
    if(item.type === 'image'){
      el = document.createElement('img');
      el.src = item.data.src;
      el.className = 'lightbox-img';
    } else if(item.type === 'video'){
      el = document.createElement('video');
      el.src = URL.createObjectURL(item.data.blob);
      el.controls = true;
      el.autoplay = true;
      el.className = 'lightbox-video';
    } else {
      el = document.createElement('audio');
      el.src = URL.createObjectURL(item.data.blob);
      el.controls = true;
      el.autoplay = true;
      el.className = 'lightbox-audio';
    }
    inner.appendChild(el);

    const multiple = lightboxMediaList.length > 1;
    document.getElementById('lightboxPrev').classList.toggle('hidden', !multiple);
    document.getElementById('lightboxNext').classList.toggle('hidden', !multiple);
  }

  function openLightboxAt(list, index){
    lightboxMediaList = list;
    lightboxIndex = index;
    document.getElementById('mediaLightbox').classList.add('open');
    renderLightboxItem(lightboxIndex);
  }

  function lightboxStep(delta){
    if(lightboxMediaList.length === 0) return;
    lightboxIndex = (lightboxIndex + delta + lightboxMediaList.length) % lightboxMediaList.length;
    renderLightboxItem(lightboxIndex);
  }

  function closeLightbox(){
    const lb = document.getElementById('mediaLightbox');
    const inner = document.getElementById('lightboxContent');
    inner.querySelectorAll('video, audio').forEach(v => v.pause());
    inner.innerHTML = '';
    lb.classList.remove('open');
    lightboxMediaList = [];
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', () => lightboxStep(-1));
  document.getElementById('lightboxNext').addEventListener('click', () => lightboxStep(1));
  document.getElementById('mediaLightbox').addEventListener('click', (e) => {
    if(e.target.id === 'mediaLightbox'){ closeLightbox(); }
  });

  document.addEventListener('keydown', (e) => {
    if(!document.getElementById('mediaLightbox').classList.contains('open')) return;
    if(e.key === 'ArrowLeft'){ lightboxStep(-1); }
    else if(e.key === 'ArrowRight'){ lightboxStep(1); }
    else if(e.key === 'Escape'){ closeLightbox(); }
  });

  function formatDuration(seconds){
    const s = Math.round(seconds || 0);
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return `${m}:${String(rem).padStart(2, '0')}`;
  }

  function audioDay(a){ return (typeof a.day === 'number') ? a.day : 0; }

  function renderMediaThumbs(){
    const wrap = document.getElementById('mediaThumbs');
    wrap.innerHTML = '';

    const combinedList = [
      ...currentImages.map(img => ({ type: 'image', data: img })),
      ...currentVideos.map(vid => ({ type: 'video', data: vid })),
      ...currentAudios.filter(a => audioDay(a) === activeDayIndex).map(aud => ({ type: 'audio', data: aud }))
    ];

    currentImages.forEach((img, idx) => {
      const box = document.createElement('div');
      box.className = 'media-thumb';
      const el = document.createElement('img');
      el.src = img.src;
      el.addEventListener('click', () => openLightboxAt(combinedList, idx));
      box.appendChild(el);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'media-remove';
      rm.textContent = '×';
      rm.addEventListener('click', (e) => { e.stopPropagation(); currentImages.splice(idx, 1); renderMediaThumbs(); });
      box.appendChild(rm);
      wrap.appendChild(box);
    });

    currentVideos.forEach((vid, idx) => {
      const box = document.createElement('div');
      box.className = 'media-thumb';
      const el = document.createElement('video');
      el.src = URL.createObjectURL(vid.blob);
      el.muted = true;
      el.addEventListener('click', () => openLightboxAt(combinedList, currentImages.length + idx));
      box.appendChild(el);
      const badge = document.createElement('span');
      badge.className = 'video-badge';
      badge.textContent = '▶ video';
      box.appendChild(badge);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'media-remove';
      rm.textContent = '×';
      rm.addEventListener('click', (e) => { e.stopPropagation(); currentVideos.splice(idx, 1); renderMediaThumbs(); });
      box.appendChild(rm);
      wrap.appendChild(box);
    });

    let audioPos = 0;
    currentAudios.forEach((aud, idx) => {
      if(audioDay(aud) !== activeDayIndex) return;
      const myPos = audioPos++;
      const box = document.createElement('div');
      box.className = 'media-thumb audio-thumb';
      const icon = document.createElement('span');
      icon.className = 'audio-icon';
      icon.textContent = '🎙';
      box.appendChild(icon);
      const label = document.createElement('span');
      label.className = 'audio-label';
      label.textContent = formatDuration(aud.duration);
      box.appendChild(label);
      box.addEventListener('click', () => openLightboxAt(combinedList, currentImages.length + currentVideos.length + myPos));
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'media-remove';
      rm.textContent = '×';
      rm.addEventListener('click', (e) => { e.stopPropagation(); currentAudios.splice(idx, 1); renderMediaThumbs(); renderDayTabs(); });
      box.appendChild(rm);
      wrap.appendChild(box);
    });
  }

  document.getElementById('photoInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for(const file of files){
      try{ currentImages.push(await resizeImageFile(file)); }
      catch(err){ alert(`Could not add "${file.name}".`); }
    }
    renderMediaThumbs();
    e.target.value = '';
  });

  document.getElementById('videoInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      if(file.size > MAX_VIDEO_MB * 1024 * 1024){
        alert(`"${file.name}" is larger than ${MAX_VIDEO_MB}MB, so it was skipped. Try a shorter clip.`);
        return;
      }
      currentVideos.push({ blob: file, type: file.type });
    });
    renderMediaThumbs();
    e.target.value = '';
  });

  // --- Voice note recording ---
  const recordAudioBtn = document.getElementById('recordAudioBtn');
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordStartTime = 0;
  const MediaRecorderCtor = window.MediaRecorder;

  if(MediaRecorderCtor && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    recordAudioBtn.addEventListener('click', async () => {
      if(mediaRecorder && mediaRecorder.state === 'recording'){
        mediaRecorder.stop();
        return;
      }
      let stream;
      try{
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch(err){
        alert('Microphone access was blocked or unavailable. Please allow microphone access to record a voice note.');
        return;
      }

      recordedChunks = [];
      try{
        mediaRecorder = new MediaRecorderCtor(stream);
      } catch(err){
        alert('Recording is not supported in this browser.');
        stream.getTracks().forEach(t => t.stop());
        return;
      }

      mediaRecorder.ondataavailable = (e) => { if(e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        recordAudioBtn.classList.remove('recording');
        recordAudioBtn.textContent = '🎙 Record voice note';
        const durationSec = (Date.now() - recordStartTime) / 1000;
        if(recordedChunks.length){
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          currentAudios.push({ blob, duration: durationSec, day: activeDayIndex });
          renderMediaThumbs();
          renderDayTabs();
        }
      };

      recordStartTime = Date.now();
      mediaRecorder.start();
      recordAudioBtn.classList.add('recording');
      recordAudioBtn.textContent = '⏹ Stop recording';
    });
  } else {
    recordAudioBtn.addEventListener('click', () => {
      alert("Voice note recording isn't supported in this browser.");
    });
  }

  let currentDays = ['', '', '', '', '', '', ''];

  function renderDayTabs(){

  function populateDictateLanguages(){

  async function ensureMicPermission(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop());

      alert('Microphone access was blocked or unavailable. Please allow microphone access for this site in your browser settings, then try again.');
      return false;

  // --- Dictation punctuation ---
  const SPOKEN_PUNCT = [
    [/\s*\b(?:nowy akapit|new paragraph)\b[,.]?\s*/gi, '\n\n'],
    [/\s*\b(?:nowa linia|nowa linijka|new line)\b[,.]?\s*/gi, '\n'],
    [/\s*\b(?:znak zapytania|pytajnik|question mark)\b[,.]?/gi, '?'],
    [/\s*\b(?:wykrzyknik|znak wykrzyknika|exclamation mark|exclamation point)\b[,.]?/gi, '!'],
    [/\s*\b(?:wielokropek|trzy kropki|ellipsis)\b[,.]?/gi, '…'],
    [/\s*\b(?:dwukropek|colon)\b[,.]?/gi, ':'],
    [/\s*\b(?:średnik|srednik|semicolon)\b[,.]?/gi, ';'],
    [/\s*\b(?:przecinek|comma)\b[,.]?/gi, ','],
    [/\s*\b(?:kropka|full stop|period)\b[,.]?/gi, '.'],
    [/\s*\b(?:myślnik|myslnik|dash)\b[,.]?\s*/gi, ' – ']
  ];

  function appendDictation(base, chunk, isFinal){
    let t = chunk.trim();
    if(!t) return base;
    if(isFinal){
      SPOKEN_PUNCT.forEach(([re, r]) => { t = t.replace(re, r); });
    }
    t = t.replace(/\s+([,.;:!?…])/g, '$1').replace(/[ \t]{2,}/g, ' ').trim();
    const atStart = !base || /(^|[.!?…]\s*|\n\s*)$/.test(base);
    if(atStart) t = t.charAt(0).toUpperCase() + t.slice(1);
    // capitalize after sentence end inside chunk
    t = t.replace(/([.!?…]\s+|\n\s*)(\p{Ll})/gu, (m, a, b) => a + b.toUpperCase());
    if(isFinal && !/[.!?…:;,]$/.test(t)) t += '.';
    if(!base) return t;
    const sep = /\n$/.test(base) || /^[,.;:!?…\n]/.test(t) ? '' : ' ';
    return base + sep + t;
  }

  if(SpeechRecognitionCtor){
    recognition = new SpeechRecognitionCtor();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      let finalChunk = '';
      let interimChunk = '';
      for(let i = event.resultIndex; i < event.results.length; i++){
        const transcript = event.results[i][0].transcript;
        if(event.results[i].isFinal){ finalChunk += transcript; }
        else { interimChunk += transcript; }
      }
      if(finalChunk){
        dictateBaseText = appendDictation(dictateBaseText, finalChunk, true);
      }
      modalTextarea.value = interimChunk ? appendDictation(dictateBaseText, interimChunk, false) : dictateBaseText;
    };

    recognition.onerror = (e) => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        dictateManualStop = true;
        isDictating = false;
        dictateBtn.classList.remove('active');
        alert('Microphone access was blocked. Please allow microphone access in your browser to use dictation.');
      } else if(e.error === 'audio-capture'){
        dictateManualStop = true;
        isDictating = false;
        dictateBtn.classList.remove('active');
        alert('No microphone was found. Please connect a microphone and try again.');
      } else if(e.error === 'network'){
        dictateManualStop = true;
        isDictating = false;
        dictateBtn.classList.remove('active');
        alert('Dictation needs an internet connection. Check your connection and try again.');
      }
      // "no-speech" and similar recoverable errors are handled by onend below,
      // which restarts automatically unless the person pressed stop themselves.
    };

    recognition.onend = () => {
      if(isDictating && !dictateManualStop){
        // Many browsers (especially on mobile) end the session after a short
        // pause even in "continuous" mode. A brief delay avoids the browser
        // rejecting an immediate restart, so dictation keeps going seamlessly.
        setTimeout(() => {
          if(!isDictating || dictateManualStop) return;
          try{ recognition.start(); }
          catch(err){ isDictating = false; dictateBtn.classList.remove('active'); }
        }, 250);
      } else {
        isDictating = false;
        dictateBtn.classList.remove('active');
      }
    };

    dictateBtn.addEventListener('click', async () => {
      if(isDictating){
        dictateManualStop = true;
        recognition.stop();
        return;
      }
      const ok = await ensureMicPermission();
      if(!ok) return;

      dictateBaseText = modalTextarea.value.trim();
      dictateManualStop = false;
      recognition.lang = dictateLangSelect.value;
      try{
        recognition.start();
        isDictating = true;
        dictateBtn.classList.add('active');
      } catch(err){
        alert('Could not start dictation. Please try again in a moment.');
      }
    });
  } else {
    dictateBtn.title = "Voice dictation isn't supported in this browser";
    dictateBtn.addEventListener('click', () => {
      alert("Voice dictation isn't supported in this browser. Try Chrome or Edge on desktop or Android.");
    });
  }

  function applySearch(){
    const q = searchBox.value.trim().toLowerCase();

    if(!q){

      searchCount.textContent = '';

    let count = 0;

  function mondayOnOrBefore(date){
    const d = new Date(date);
    const day = d.getDay(); // 0=Sun ... 6=Sat
    const diff = (day === 0) ? -6 : (1 - day);
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function firstWeekStart(y){
    return mondayOnOrBefore(new Date(y, 0, 1));
  }

  function render(persist){
    const bdVal = getBirthDateValue();
    if(!bdVal) { ledgerSection.style.display = 'none'; statsEl.style.display = 'none'; return; }

    if(persist !== false){
      localStorage.setItem(LS_BIRTH, bdVal);
      localStorage.setItem(LS_EXPECT, expectancyInput.value);
    }

    const birth = new Date(bdVal + 'T00:00:00');
    const years = Math.max(1, Math.min(110, parseInt(expectancyInput.value) || 80));
    const now = new Date();

    const birthYear = birth.getFullYear();
    // Which of the 52 columns (in the birth year) contains the actual birthday —
    // everything before that column didn't happen yet, so it stays blank.
    const birthWeekCol = Math.floor((birth - firstWeekStart(birthYear)) / MS_WEEK);

    let weeksLived = 0;
    let weeksLeft = 0;

    const notedKeys = new Set([...Object.keys(notes), ...mediaKeysCache]);
    document.getElementById('statNotes').textContent = notedKeys.size.toLocaleString();
    statsEl.style.display = 'flex';

    grid.innerHTML = '';

    function buildWeekNumberRow(){
      const row = document.createElement('div');
      row.className = 'week-number-row';
      row.appendChild(document.createElement('div'));
      const wGrid = document.createElement('div');
      wGrid.className = 'week-number-grid';
      for(let w = 1; w <= 52; w++){
        const label = document.createElement('div');
        label.className = 'week-number-label';
        label.textContent = w;
        wGrid.appendChild(label);
      }
      row.appendChild(wGrid);
      return row;
    }

    for(let age = 0; age <= years; age++){
      const calYear = birthYear + age;
      const yearStart = firstWeekStart(calYear);

      if(age === 0 || (age % 10 === 0)){
        grid.appendChild(buildWeekNumberRow());
      }

      const row = document.createElement('div');
      row.className = 'year-row' + (age > 0 && age % 10 === 0 ? ' decade-mark' : '');

      const label = document.createElement('div');
      label.className = 'year-label';
      label.textContent = age;
      row.appendChild(label);

      const yearGrid = document.createElement('div');
      yearGrid.className = 'year-grid';

      for(let w = 0; w < 52; w++){
        const weekStart = addDays(yearStart, w * 7);
        const weekEnd = addDays(weekStart, 6);
        weekEnd.setHours(23, 59, 59, 999);
        const key = dateKey(weekStart);

        const cell = document.createElement('div');

        // Weeks before the actual birthday, in the birth year, are blank —
        // that time is simply before this life started.
        if(age === 0 && w < birthWeekCol){
          cell.className = 'cell void';
          yearGrid.appendChild(cell);
          continue;
        }

        let state = 'future';
        if(weekEnd < now){ state = 'lived'; weeksLived++; }
        else if(weekStart <= now && now <= weekEnd){ state = 'now'; weeksLived++; }
        else { weeksLeft++; }

        cell.className = 'cell ' + state;
        cell.dataset.key = key;

        if(entryHasText(key) || mediaKeysCache.has(key)){ cell.classList.add('has-note'); }

        const tip = document.createElement('div');
        tip.className = 'tip';
        tip.textContent = formatRange(weekStart, weekEnd);
        cell.appendChild(tip);

        cell.addEventListener('click', () => openModal(key, weekStart, weekEnd, age));

        yearGrid.appendChild(cell);
      }

      row.appendChild(yearGrid);
      grid.appendChild(row);
    }

    document.getElementById('statLived').textContent = weeksLived.toLocaleString();
    document.getElementById('statLeft').textContent = weeksLeft.toLocaleString();

    ledgerSection.style.display = 'block';
    applySearch();
  }

  async function collectSortedEntries(){
    const allKeys = Array.from(new Set([...Object.keys(notes), ...mediaKeysCache])).sort();
    const entries = [];
    for(const key of allKeys){
      const weekStart = new Date(key + 'T00:00:00');
      const weekEnd = addDays(weekStart, 6);
      let images = [], videos = [], audios = [];
      if(mediaKeysCache.has(key)){
        const media = await getMedia(key);
        images = media.images || [];
        videos = media.videos || [];
        audios = media.audios || [];
      }
      entries.push({ key, days: Array.isArray(notes[key]) ? notes[key] : ['', '', '', '', '', '', ''], weekStart, weekEnd, images, videos, audios });
    }
    return entries;
  }

  let fontsRegistered = false;
  function registerPdfFonts(doc){
    if(!fontsRegistered){
      doc.addFileToVFS('DejaVuSans.ttf', DEJAVU_REGULAR_B64);
      doc.addFont('DejaVuSans.ttf', 'DejaVuSans', 'normal');
      doc.addFileToVFS('DejaVuSans-Bold.ttf', DEJAVU_BOLD_B64);
      doc.addFont('DejaVuSans-Bold.ttf', 'DejaVuSans', 'bold');
      fontsRegistered = true;
    }
  }

  document.getElementById('notesPdfBtn').addEventListener('click', async () => {
    if(!window.jspdf){ alert('PDF generator did not load. Check your internet connection and try again.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    registerPdfFonts(doc);

    const marginX = 54;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const maxWidth = pageWidth - marginX * 2;
    let y = 64;

    doc.setFont('DejaVuSans', 'bold');
    doc.setFontSize(20);
    doc.setTextColor(38, 51, 45);
    doc.text('Your Life in Weeks \u2014 Notes', marginX, y);

    y += 18;
    doc.setFont('DejaVuSans', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(120, 120, 120);
    doc.text(`Generated ${new Date().toLocaleDateString()}`, marginX, y);
    y += 30;

    const entries = await collectSortedEntries();

    if(entries.length === 0){
      doc.setFont('DejaVuSans', 'normal');
      doc.setFontSize(12);
      doc.setTextColor(30, 30, 30);
      doc.text('No notes have been saved yet.', marginX, y);
    } else {
      for(const e of entries){
        if(y > pageHeight - 90){ doc.addPage(); y = 64; }

        doc.setFont('DejaVuSans', 'bold');
        doc.setFontSize(12);
        doc.setTextColor(184, 134, 46);
        doc.text(formatRange(e.weekStart, e.weekEnd), marginX, y);
        y += 6;
        doc.setDrawColor(217, 193, 151);
        doc.line(marginX, y, marginX + maxWidth, y);
        y += 16;

        e.days.forEach((t, i) => {
          if(!t || !t.trim()) return;
          if(y > pageHeight - 60){ doc.addPage(); y = 64; }
          doc.setFont('DejaVuSans', 'bold');
          doc.setFontSize(10.5);
          doc.setTextColor(90, 90, 90);
          doc.text(DAY_LABELS[i], marginX, y);
          y += 14;
          doc.setFont('DejaVuSans', 'normal');
          doc.setFontSize(11);
          doc.setTextColor(30, 30, 30);
          const lines = doc.splitTextToSize(t.trim(), maxWidth);
          lines.forEach(line => {
            if(y > pageHeight - 50){ doc.addPage(); y = 64; }
            doc.text(line, marginX, y);
            y += 15;
          });
          y += 6;
        });

        for(const img of e.images){
          const displayW = Math.min(220, maxWidth);
          const displayH = displayW * (img.h / img.w);
          if(y + displayH > pageHeight - 40){ doc.addPage(); y = 64; }
          try{ doc.addImage(img.src, 'JPEG', marginX, y, displayW, displayH); }
          catch(err){ /* skip image if it fails to embed */ }
          y += displayH + 10;
        }

        y += 14;
      }
    }

    doc.save('life-in-weeks-notes.pdf');
  });

  document.getElementById('deleteAllBtn').addEventListener('click', async () => {
    const count = new Set([...Object.keys(notes), ...mediaKeysCache]).size;
    if(count === 0){ alert('There are no notes to delete.'); return; }
    const sure = confirm(`Are you sure you want to delete all ${count} saved note(s), including any attached photos and videos? This action cannot be undone.`);
    if(!sure) return;
    notes = {};
    saveNotes();
    await clearAllMedia();
    mediaKeysCache = new Set();
    render(false);
    applySearch();
  });

  // Restore remembered birthdate/expectancy, or fall back to a demo date.
  const savedBirth = localStorage.getItem(LS_BIRTH);
  const savedExpect = localStorage.getItem(LS_EXPECT);

  if(savedBirth){
    setBirthDateValue(savedBirth);
    if(savedExpect) expectancyInput.value = savedExpect;
  } else {
    const defaultBirth = new Date();
    defaultBirth.setFullYear(defaultBirth.getFullYear() - 30);
    setBirthDateValue(defaultBirth.toISOString().slice(0,10));
  }

  refreshMediaKeysCache().finally(() => render(false));
</script>
